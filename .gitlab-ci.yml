# Builds and pushes the release image to Docker Hub for version tags (vX.Y.Z)
# only. To spare our hosts' storage and compute, nothing else is built here;
# development builds happen locally (see README, "Releases").

release:
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: docker.io/therealdeepsight/top-assist-frontend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    # Git tags carry a "v" prefix, image tags do not: v1.2.0 -> 1.2.0.
    - VERSION="${CI_COMMIT_TAG#v}"
    - export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
    # SBOM and provenance attestations require the docker-container driver.
    - docker buildx create --name attest --driver docker-container --use
    - >-
      docker buildx build -f Containerfile
      --platform linux/amd64
      --sbom=true --provenance=mode=max
      --build-arg SOURCE_DATE_EPOCH
      --label org.opencontainers.image.version="$VERSION"
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --label org.opencontainers.image.source="$CI_PROJECT_URL"
      --output type=registry,rewrite-timestamp=true
      --tag "$IMAGE:$VERSION"
      .
